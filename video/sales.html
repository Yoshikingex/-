    b.ring.scale.setScalar(Math.max(0.001, easeOutBack(k)));
  });
  aimArm(p1.armR, new THREE.Vector3(-0.15, 0.15, 1), smooth(0.4, 0.9, t) * (1 - smooth(2.6, 3.0, t)));
  aimArm(p1.armL, new THREE.Vector3(-0.35, -0.55, 0.75), 1);
  p1.head.rotation.y = 0.25 * Math.sin(t * 1.5);

  // 2 — call and mail the target company
  aimArm(p2.armL, new THREE.Vector3(-0.15, 0.95, 0.2), smooth(2.6, 3.1, t) * (1 - smooth(5.4, 5.8, t)));
  aimArm(p2.armR, new THREE.Vector3(-0.3, -0.6, 0.7), 1);
  phone.visible = t > 2.6 && t < 5.8;
  waves.forEach((w, i) => {
    const u = clamp01((t - 2.9 - i * 0.45) / 1.3);
    w.position.set(-0.7 + 2.0 * u, 1.55 + 0.3 * u, 0.2 - 0.6 * u); w.scale.setScalar(0.4 + 1.6 * u);
    w.material.opacity = u > 0 && u < 1 ? 0.95 * (1 - u * u) : 0;
  });
  mails.forEach((m, i) => {
    const u = clamp01((t - 3.3 - i * 0.6) / 0.9);
    m.visible = u > 0 && u < 1;
    m.position.set(-0.1 + 1.25 * u, 1.05 + 1.0 * Math.sin(Math.PI * u) + 0.6 * u, 0.2 - 0.7 * u);
    m.rotation.set(0.2, Math.PI / 2 - 0.4, 0.3 * Math.sin(u * 6));
  });
  const lit = smooth(3.9, 4.6, t);
  winMat.emissiveIntensity = 0.9 * lit; officeMat.emissiveIntensity = 0.12 * lit;

  // 3 — the appointment is set
  cells.forEach((c, i) => {
    const k = i === HIT ? smooth(6.0, 6.35, t) : 0;
    c.m.color.set('#E8E3D6').lerp(new THREE.Color('#E2C46E'), k); c.m.emissiveIntensity = 0.4 * k;
  });
  check.scale.setScalar(Math.max(0.001, easeOutBack((t - 6.3) / 0.45)));
  check.rotation.y = Math.sin(t * 2) * 0.15;
  const pump = smooth(6.5, 6.8, t) * (1 - smooth(7.9, 8.3, t));
  aimArm(p3.armR, new THREE.Vector3(0.1, 1, 0.15 + 0.1 * Math.sin(t * 14)), pump);
  aimArm(p3.armL, new THREE.Vector3(-0.15, 0.95, 0.2), smooth(5.1, 5.5, t) * (1 - smooth(6.3, 6.6, t)));
  p3.g.position.y = 0.16 + 0.06 * Math.max(0, Math.sin((t - 6.6) * 9)) * pump;
  sparks3.forEach(s => {
    const u = clamp01((t - 6.4) / 1.0);
    s.visible = u > 0 && u < 1;
    s.position.set(0.55 + Math.cos(s.userData.a) * s.userData.r * (0.4 + u), 2.95 + Math.sin(s.userData.a) * s.userData.r * (0.4 + u), -0.6);
    s.scale.setScalar(1 - u);
  });

  // 4 — hearing → proposal → agreement
  bubC1.scale.setScalar(Math.max(0.001, easeOutBack((t - 8.0) / 0.35) * (1 - smooth(8.75, 8.95, t))));
  bubS.scale.setScalar(Math.max(0.001, easeOutBack((t - 8.9) / 0.35) * (1 - smooth(9.75, 9.95, t))));
  bubC2.scale.setScalar(Math.max(0.001, easeOutBack((t - 9.9) / 0.35) * (1 - smooth(10.9, 11.1, t))));
  bars.forEach((b, i) => { b.scale.y = Math.max(0.001, b.userData.h * easeOutBack((t - 8.8 - i * 0.18) / 0.6)); });
  aimArm(p4.armL, new THREE.Vector3(-0.55, 0.35, 0.75), smooth(8.8, 9.15, t) * (1 - smooth(9.8, 10.2, t)));
  aimArm(p4.armR, new THREE.Vector3(-0.3, -0.5, 0.8), 1);
  aimArm(c4.armR, new THREE.Vector3(-0.3, -0.5, 0.8), 1); aimArm(c4.armL, new THREE.Vector3(0.3, -0.5, 0.8), 1);
  c4.head.rotation.x = 0.18 * pulse(10.0, 10.8, t) * Math.sin((t - 10) * 14); // nod

  // 5 — stamp the contract, shake hands, celebrate
  const down = smooth(10.6, 10.95, t), up = smooth(11.0, 11.35, t);
  stamp.position.set(0.16, 0.93 + 0.55 * (1 - down) + 0.55 * up, -0.58); stamp.visible = t < 11.8;
  stamp.scale.setScalar(1 - smooth(11.4, 11.8, t) + 0.001);
  seal.scale.setScalar(t > 10.95 ? 1 : 0.001);
  const shake = smooth(11.5, 11.95, t) * (1 - smooth(13.4, 13.9, t));
  const wob = 0.09 * Math.sin((t - 11.9) * 16) * smooth(11.9, 12.1, t) * (1 - smooth(12.9, 13.1, t));
  const hand = new THREE.Vector3(0.36, -0.42 + wob, 0.46);
  aimArm(p5.armR, hand, shake); aimArm(c5.armR, hand, shake);
  p5.head.rotation.x = c5.head.rotation.x = 0.12 * shake;
  const burst = t - 12.3;
  confetti.forEach(c => {
    const u = burst - c.userData.d;
    c.visible = u > 0 && u < 2.6;
    if (!c.visible) return;
    const { a, v, up: vu, spin } = c.userData;
    c.position.set(Math.cos(a) * v * u * 0.85, 2.4 + vu * u - 4.2 * u * u, 0.3 + Math.sin(a) * v * u * 0.4);
    c.rotation.set(spin * u, spin * 0.6 * u, spin * 0.3 * u);
  });
  const gr = clamp01((t - 12.3) / 1.2);
  glowRing.scale.setScalar(0.3 + 2.0 * gr); glowRing.material.opacity = gr > 0 && gr < 1 ? 0.8 * (1 - gr) : 0;

  renderer.render(scene, camera);
}
window.renderAt = renderAt;
window.grab = (t, quality) => { renderAt(t); return renderer.domElement.toDataURL('image/jpeg', quality || 0.95); };
renderAt(0);
window.__ready = true;
</script>
